name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, such as v1.3.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify npm publish tag
        run: |
          set -euo pipefail

          case "$TAG_NAME" in
            v*) ;;
            *)
              echo "npm publish only supports tags starting with v: $TAG_NAME" >&2
              exit 1
              ;;
          esac

          package_version="$(node -p "require('./package.json').version")"
          tag_version="${TAG_NAME#v}"

          if [ "$tag_version" != "$package_version" ]; then
            echo "npm publish tag version ($tag_version) must exactly match package.json version ($package_version)." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run build

      - name: Check npm package contents
        run: npm run pack:check

      - name: Publish to npm
        run: npm publish --access public
